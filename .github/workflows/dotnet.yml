name: .NET

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # The release workflow runs these same tests before it publishes.
  workflow_call:

permissions:
  contents: read

env:
  RELEASE_CONFIG: Release

jobs:

  build:
    # note: changing build/name breaks the branch protection
    name: Build-Test

    # The tests need SQL Server LocalDB and .NET Framework, which only Windows has.
    runs-on: windows-latest

    steps:

    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: |
          3.1.x
          6.0.x

    - name: Restore NuGet Packages
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration ${{ env.RELEASE_CONFIG }}

    # Start up sqlserver
    - name: Install SQL Local DB
      run: ./.github/SetupSqlLocalDb.ps1
      shell: pwsh

    - name: dotnet test
      run: >
        dotnet test --configuration ${{ env.RELEASE_CONFIG }} --environment DOTNET_ENVIRONMENT="GitHubActions"

    # Catches packaging mistakes, such as a missing README, before a release does. The
    # release workflow builds the real packages.
    - name: dotnet pack (check only)
      run: >
        dotnet pack
        --configuration ${{ env.RELEASE_CONFIG }}
        -p:Version="0.0.0-ci"
        --include-symbols
        --output "${{ runner.temp }}/pack-check"
