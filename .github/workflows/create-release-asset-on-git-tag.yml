on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

name: Create Release on Git Tag

# Default to read-only. Each job below grants what it needs.
permissions:
  contents: read

env:
  CONFIG: Release
  SOLUTION_NAME: Lussatite.FeatureManagement

jobs:
  # Cheap checks first, so a bad tag fails before the tests use a Windows runner.
  # The draft-release and publish jobs repeat the checks they need.
  verify-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history, needed to check that the tag is on main.

      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tagged commit is not reachable from main"
            exit 1
          fi

      - name: Verify tag format
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not look like vMAJOR.MINOR.PATCH[-suffix]"
            exit 1
          fi

  # The same tests as pull requests. Nothing below runs, and no approval is requested,
  # unless they pass.
  test:
    needs: verify-tag
    uses: ./.github/workflows/dotnet.yml
    permissions:
      contents: read

  # Everything in this job can be undone: it builds the packages and creates a draft
  # GitHub release. Delete the draft to back out. The irreversible steps are in the
  # publish job, which waits for approval.
  draft-release:
    needs: test
    # The solution includes a .NET Framework project, so build it where the tests ran.
    runs-on: windows-latest
    permissions:
      contents: write # Needed to create the draft release and attach assets.

    defaults:
      run:
        shell: bash

    steps:

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Full history, needed to check that the tag is on main.

      # Only release commits that went through the protected main branch.
      - name: Verify tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tagged commit is not reachable from main"
            exit 1
          fi

      # Tag names can contain shell metacharacters, so only accept vMAJOR.MINOR.PATCH[-suffix].
      - name: Get Release Version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not look like vMAJOR.MINOR.PATCH[-suffix]"
            exit 1
          fi
          echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Print Release Version
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "RELEASE_TAG=$RELEASE_TAG"
          echo "RELEASE_VERSION=$RELEASE_VERSION"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            3.1.x
            6.0.x

      - name: Restore NuGet Packages
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration "$CONFIG" -p:Version="$RELEASE_VERSION"

      - name: Create artifacts directory
        run: mkdir -p artifacts

      - name: dotnet pack
        run: >
          dotnet pack
          --configuration "$CONFIG"
          -p:Version="$RELEASE_VERSION"
          --include-symbols
          --output artifacts/

      - name: Inspect artifacts directory
        run: ls -l artifacts/

      - name: Archive artifacts directory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.SOLUTION_NAME }}.artifacts.${{ env.RELEASE_VERSION }}
          path: |
            artifacts/

      # Uses the preinstalled GitHub CLI. The old actions/create-release and
      # actions/upload-release-asset actions are archived and no longer maintained.
      # The release stays a draft until the publish job, because a published release is
      # immutable and cannot receive assets. A failed or rejected run leaves a draft that
      # can be deleted.
      # Only tags with a suffix, such as v1.5.0-alpha.1, are prereleases. GitHub never marks
      # a prerelease as Latest, so stable tags must not be prereleases.
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "Release $RELEASE_TAG" \
            "${args[@]}"

      - name: Create release directory
        run: mkdir -p release

      # Built-in cmdlet instead of a third-party action, so nothing else can touch
      # artifacts/ between "dotnet pack" and "dotnet nuget push".
      - name: Create Release Zip File
        shell: pwsh
        run: >
          Compress-Archive
          -Path LICENSE, README.md, artifacts
          -DestinationPath "release/$env:SOLUTION_NAME-$env:RELEASE_VERSION.zip"

      - name: Inspect release directory
        run: ls -l release/

      - name: Archive release directory
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.SOLUTION_NAME }}.release.${{ env.RELEASE_VERSION }}
          path: |
            release/

      - name: Attach Zip, .nupkg and .snupkg files to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload "$RELEASE_TAG"
          "release/${SOLUTION_NAME}-${RELEASE_VERSION}.zip"
          artifacts/*.nupkg
          artifacts/*.snupkg

  # The irreversible steps: the nuget.org push cannot be undone, and publishing the
  # release makes it and its tag immutable. This job waits for approval from a required
  # reviewer of the nuget environment, which only accepts v* tags. By then the draft
  # release and its packages exist, so review them before you approve.
  # The nuget.org Trusted Publishing policy names this workflow file and the nuget
  # environment, so keep both on this job.
  publish:
    needs: draft-release
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: write # Needed to publish the draft release.
      id-token: write # Needed for NuGet Trusted Publishing (OIDC).

    steps:

      # Tag names can contain shell metacharacters, so only accept vMAJOR.MINOR.PATCH[-suffix].
      - name: Get Release Version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not look like vMAJOR.MINOR.PATCH[-suffix]"
            exit 1
          fi
          echo "RELEASE_TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # The same files the draft-release job attached to the draft release.
      - name: Download artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: ${{ env.SOLUTION_NAME }}.artifacts.${{ env.RELEASE_VERSION }}
          path: artifacts

      - name: Inspect artifacts directory
        run: ls -l artifacts/

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      # Trusted Publishing: exchanges the GitHub OIDC token for a short-lived NuGet API key.
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # dotnet nuget push also uploads the matching .snupkg symbol package.
      - name: Publish on nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: >
          dotnet nuget push 'artifacts/*.nupkg'
          -k "$NUGET_API_KEY"
          -s https://api.nuget.org/v3/index.json

      # This job has no checkout, so tell gh which repository to use.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false
